<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lịch họp công ty</title>
        <style>
            :root {
                color-scheme: light;
                font-family: "Trebuchet MS", "Segoe UI", sans-serif;
                color: #183332;
                background: #f2f5f1;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                line-height: 1.5;
            }

            .page-header {
                padding: 30px max(24px, calc((100% - 760px) / 2));
                color: #f8faf7;
                background: #173c39;
                border-bottom: 5px solid #d47752;
            }

            .page-header p {
                margin: 0 0 4px;
                color: #b9d2c9;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 1.2px;
                text-transform: uppercase;
            }

            h1,
            h2,
            p {
                margin-top: 0;
            }

            h1 {
                margin-bottom: 0;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 32px;
            }

            main {
                width: min(760px, calc(100% - 40px));
                margin: 0 auto;
                padding: 26px 0 56px;
            }

            .form-section {
                padding: 25px 0 30px;
                border-bottom: 1px solid #c9d5ce;
            }

            .section-heading {
                display: flex;
                align-items: baseline;
                gap: 14px;
                margin-bottom: 18px;
            }

            .section-number {
                color: #b65f3d;
                font-size: 13px;
                font-weight: 700;
            }

            h2 {
                margin-bottom: 0;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 24px;
            }

            .field-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px 22px;
            }

            .field {
                display: flex;
                min-width: 0;
                flex-direction: column;
                gap: 6px;
                font-size: 14px;
                font-weight: 700;
            }

            input[type="text"],
            input[type="email"],
            input[type="tel"],
            input[type="date"],
            select,
            textarea {
                width: 100%;
                min-height: 42px;
                padding: 9px 11px;
                border: 1px solid #aebdb5;
                border-radius: 3px;
                background: #fff;
                color: #183332;
                font: inherit;
                font-weight: 400;
            }

            textarea {
                min-height: 82px;
                resize: vertical;
            }

            input:focus,
            select:focus,
            textarea:focus {
                outline: 3px solid #e8b196;
                outline-offset: 1px;
                border-color: #a74f31;
            }

            fieldset {
                min-width: 0;
                margin: 0;
                padding: 11px 13px 13px;
                border: 1px solid #c4d0c9;
                border-radius: 3px;
            }

            legend {
                padding: 0 5px;
                font-size: 14px;
                font-weight: 700;
            }

            .choices {
                display: flex;
                flex-wrap: wrap;
                gap: 10px 20px;
            }

            .choice {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                font-size: 14px;
                font-weight: 400;
            }

            input[type="checkbox"],
            input[type="radio"] {
                width: 16px;
                height: 16px;
                margin: 0;
                accent-color: #1e665b;
            }

            .wide {
                grid-column: 1 / -1;
            }

            .form-actions {
                display: flex;
                gap: 10px;
                margin-top: 19px;
            }

            button {
                min-height: 42px;
                padding: 9px 17px;
                border: 1px solid transparent;
                border-radius: 3px;
                font: inherit;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
            }

            button[type="submit"] {
                color: #fff;
                background: #1e665b;
            }

            button[type="reset"] {
                color: #294642;
                border-color: #9eafa6;
                background: transparent;
            }

            button:hover {
                filter: brightness(0.94);
            }

            .survey-intro {
                margin: 0 0 8px;
                color: #526764;
                font-size: 15px;
            }

            .survey-question {
                padding: 19px 0;
                border-bottom: 1px solid #d6dfda;
            }

            fieldset.survey-question {
                padding-right: 0;
                padding-left: 0;
                border: 0;
                border-bottom: 1px solid #d6dfda;
                border-radius: 0;
            }

            .question-title {
                display: block;
                margin: 0 0 11px;
                color: #183332;
                font-size: 15px;
                font-weight: 700;
            }

            .survey-question select {
                width: min(100%, 440px);
            }

            .choice-stack {
                display: grid;
                gap: 9px;
            }

            .choice-stack .choice {
                width: fit-content;
                min-height: 24px;
                color: #344c49;
            }

            .other-detail {
                width: min(100%, 220px) !important;
                min-height: 38px !important;
                margin-left: 25px;
            }

            .price-fields {
                display: flex;
                align-items: end;
                gap: 8px;
            }

            .price-part {
                display: flex;
                flex-direction: column;
                gap: 5px;
                color: #526764;
                font-size: 12px;
            }

            .price-part input {
                width: 130px;
                min-height: 42px;
                padding: 9px 11px;
                border: 1px solid #aebdb5;
                border-radius: 3px;
                background: #fff;
                color: #183332;
                font: inherit;
                font-size: 15px;
            }

            .survey-question textarea {
                min-height: 112px;
            }

            .matrix-scroll {
                overflow-x: auto;
                border: 1px solid #d0dcd6;
                border-radius: 3px;
            }

            .matrix-table {
                width: 100%;
                min-width: 620px;
                border-collapse: collapse;
                background: #fff;
                font-size: 13px;
            }

            .matrix-table caption {
                padding: 0 0 10px;
                color: #183332;
                font-size: 15px;
                font-weight: 700;
                text-align: left;
            }

            .matrix-table th,
            .matrix-table td {
                padding: 10px 8px;
                border-bottom: 1px solid #e0e7e3;
                text-align: center;
            }

            .matrix-table thead th {
                color: #fff;
                background: #285a54;
                font-weight: 600;
            }

            .matrix-table thead th:first-child {
                width: 42%;
                text-align: left;
            }

            .matrix-table tbody th {
                text-align: left;
                font-weight: 600;
            }

            .matrix-table tbody tr:last-child th,
            .matrix-table tbody tr:last-child td {
                border-bottom: 0;
            }

            .matrix-table input {
                width: 16px;
                height: 16px;
                accent-color: #1e665b;
            }

            .survey-status {
                margin: 15px 0 0;
                padding: 12px 14px;
                border-left: 4px solid #d47752;
                background: #f2f5f1;
                color: #183332;
            }

            .table-wrap {
                overflow-x: auto;
            }

            .product-table {
                width: 100%;
                min-width: 520px;
                border-collapse: collapse;
                background: #fff;
            }

            .product-table caption {
                padding: 0 0 10px;
                color: #526764;
                font-size: 13px;
                text-align: left;
            }

            .product-table th,
            .product-table td {
                padding: 14px 16px;
                border: 1px solid #c9d5ce;
                text-align: left;
            }

            .product-table thead th {
                color: #f8faf7;
                background: #173c39;
                font-size: 14px;
            }

            .product-table tbody tr:nth-child(even) {
                background: #edf3ef;
            }

            .product-table td:nth-child(2) {
                white-space: nowrap;
            }

            .product-table td:last-child,
            .product-table th:last-child {
                width: 140px;
                text-align: center;
            }

            .product-table td[colspan="2"] {
                color: #1e665b;
                font-weight: 700;
            }

            @media (max-width: 620px) {
                .page-header {
                    padding: 25px 20px;
                }

                h1 {
                    font-size: 28px;
                }

                main {
                    width: min(100% - 32px, 480px);
                    padding-top: 15px;
                }

                .field-grid {
                    grid-template-columns: 1fr;
                    gap: 14px;
                }

                .wide {
                    grid-column: auto;
                }
            }
        </style>
    </head>
    <body>
        <header class="page-header">
            <p>LỊCH LÀM VIỆC</p>
            <h1>Lịch họp công ty</h1>
        </header>
        <main>
            <div class="table-wrap">
                <table class="product-table">
                    <caption>Lịch họp và nội dung cuộc họp</caption>
                    <thead>
                        <tr>
                            <th scope="col">Ngày</th>
                            <th scope="col">Giờ</th>
                            <th scope="col">Nội dung cuộc họp</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td rowspan="2">Thứ Hai</td>
                            <td>08:30 - 09:30</td>
                            <td>Họp giao ban đầu tuần</td>
                        </tr>
                        <tr>
                            <td>14:00 - 15:00</td>
                            <td>Rà soát tiến độ dự án</td>
                        </tr>
                        <tr>
                            <td>Thứ Ba</td>
                            <td colspan="2">09:00 - 12:00 | Hội nghị kế hoạch quý</td>
                        </tr>
                        <tr>
                            <td>Thứ Tư</td>
                            <td>13:30 - 14:30</td>
                            <td>Đào tạo nội bộ</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </body>
</html>
