<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Đăng ký người dùng</title>
        <style>
            :root {
                color-scheme: light;
                font-family: "Trebuchet MS", "Segoe UI", sans-serif;
                color: #183332;
                background: #f2f5f1;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                line-height: 1.5;
            }

            .page-header {
                padding: 30px max(24px, calc((100% - 960px) / 2));
                color: #f8faf7;
                background: #173c39;
                border-bottom: 5px solid #d47752;
            }

            .page-header p {
                margin: 0 0 4px;
                color: #b9d2c9;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 1.2px;
                text-transform: uppercase;
            }

            h1,
            h2,
            p {
                margin-top: 0;
            }

            h1 {
                margin-bottom: 0;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 32px;
            }

            main {
                width: min(960px, calc(100% - 40px));
                margin: 0 auto;
                padding: 26px 0 56px;
            }

            .form-section {
                padding: 25px 0 30px;
                border-bottom: 1px solid #c9d5ce;
            }

            .section-heading {
                display: flex;
                align-items: baseline;
                gap: 14px;
                margin-bottom: 18px;
            }

            .section-number {
                color: #b65f3d;
                font-size: 13px;
                font-weight: 700;
            }

            h2 {
                margin-bottom: 0;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 24px;
            }

            .field-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px 22px;
            }

            .field {
                display: flex;
                min-width: 0;
                flex-direction: column;
                gap: 6px;
                font-size: 14px;
                font-weight: 700;
            }

            input[type="text"],
            input[type="email"],
            input[type="tel"],
            input[type="date"],
            select,
            textarea {
                width: 100%;
                min-height: 42px;
                padding: 9px 11px;
                border: 1px solid #aebdb5;
                border-radius: 3px;
                background: #fff;
                color: #183332;
                font: inherit;
                font-weight: 400;
            }

            textarea {
                min-height: 82px;
                resize: vertical;
            }

            input:focus,
            select:focus,
            textarea:focus {
                outline: 3px solid #e8b196;
                outline-offset: 1px;
                border-color: #a74f31;
            }

            fieldset {
                min-width: 0;
                margin: 0;
                padding: 11px 13px 13px;
                border: 1px solid #c4d0c9;
                border-radius: 3px;
            }

            legend {
                padding: 0 5px;
                font-size: 14px;
                font-weight: 700;
            }

            .choices {
                display: flex;
                flex-wrap: wrap;
                gap: 10px 20px;
            }

            .choice {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                font-size: 14px;
                font-weight: 400;
            }

            input[type="checkbox"],
            input[type="radio"] {
                width: 16px;
                height: 16px;
                margin: 0;
                accent-color: #1e665b;
            }

            .wide {
                grid-column: 1 / -1;
            }

            .form-actions {
                display: flex;
                gap: 10px;
                margin-top: 19px;
            }

            button {
                min-height: 42px;
                padding: 9px 17px;
                border: 1px solid transparent;
                border-radius: 3px;
                font: inherit;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
            }

            button[type="submit"] {
                color: #fff;
                background: #1e665b;
            }

            button[type="reset"] {
                color: #294642;
                border-color: #9eafa6;
                background: transparent;
            }

            button:hover {
                filter: brightness(0.94);
            }

            @media (max-width: 620px) {
                .page-header {
                    padding: 25px 20px;
                }

                h1 {
                    font-size: 28px;
                }

                main {
                    width: min(100% - 32px, 480px);
                    padding-top: 15px;
                }

                .field-grid {
                    grid-template-columns: 1fr;
                    gap: 14px;
                }

                .wide {
                    grid-column: auto;
                }
            }
        </style>
    </head>
    <body>
        <header class="page-header">
            <p>Bài thực hành HTML</p>
            <h1>Đăng ký người dùng</h1>
        </header>
        <main>
            <section class="form-section" aria-labelledby="registration-title">
                <div class="section-heading">
                    <span class="section-number">ĐĂNG KÝ</span>
                    <h2 id="registration-title">Thông tin người dùng</h2>
                </div>
                <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
                    <div class="field-grid">
                        <label class="field">
                            Họ và tên
                            <input type="text" name="name" autocomplete="name" required>
                        </label>
                        <label class="field">
                            Email
                            <input type="email" name="email" autocomplete="email" required>
                        </label>
                        <label class="field">
                            Số điện thoại
                            <input type="tel" name="phone" autocomplete="tel" required>
                        </label>
                        <fieldset>
                            <legend>Giới tính</legend>
                            <div class="choices">
                                <label class="choice"><input type="radio" name="gender" value="male" required> Nam</label>
                                <label class="choice"><input type="radio" name="gender" value="female"> Nữ</label>
                                <label class="choice"><input type="radio" name="gender" value="other"> Khác</label>
                            </div>
                        </fieldset>
                    </div>
                    <div class="form-actions">
                        <button type="submit">Gửi đăng ký</button>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
